[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "altai-satellite"
dynamic = ["version"]
authors = [{name = "Kai Teramoto"}]
description = "Constellation satellite for the ALTAI telescope DAQ boards"
readme = "README.md"
license = {text = "EUPL-1.2"}
requires-python = ">=3.11"
dependencies = [
    "ConstellationDAQ==1.0.2",
]

[project.optional-dependencies]
alpidedaqboard = ["alpide-daq-software"]

[project.scripts]
SatelliteAltai = "altai_satellite.__main__:main"

[project.entry-points."constellation.satellites"]
Altai = "altai_satellite"

[dependency-groups]
dev = ["basedpyright", "ruff", "pytest"]

[tool.uv.sources]
alpide-daq-software = { path = "../alpide-daq-software", editable = true }

[tool.setuptools_scm]
version_scheme = "only-version"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "standard"
extraPaths = ["../alpide-daq-software"]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "B", "A", "I", "UP"]
